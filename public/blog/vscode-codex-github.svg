<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Start coding: editor, assistant, version history</title>
  <desc id="desc">Three connected stages: write files in VS Code, understand and review changes with Codex, and save commits to GitHub.</desc>
  <rect width="1600" height="800" fill="#071a2d"/>
  <rect x="0" y="0" width="20" height="800" fill="#9bdfff"/>
  <g font-family="Arial, sans-serif">
    <text x="90" y="112" fill="#9bdfff" font-size="25" font-weight="700">BARBAROTECH / FROM FIRST FILE TO LIVE WEBSITE</text>
    <text x="90" y="215" fill="#f7fbff" font-size="76" font-weight="700" letter-spacing="-2">Your first coding workflow.</text>
    <text x="90" y="275" fill="#b7ccdf" font-size="29">Make something small. Understand it. Save your progress.</text>
    <g transform="translate(90 355)">
      <rect width="430" height="280" rx="14" fill="#102a44"/>
      <text x="32" y="60" fill="#9bdfff" font-size="26">VS CODE</text>
      <text x="32" y="118" fill="#ffffff" font-size="39" font-weight="700">Write your files</text>
      <g fill="#c6d8e8" font-size="26"><text x="32" y="175">index.html</text><text x="32" y="216">styles.css + script.js</text></g>
    </g>
    <path d="M542 495h58m-15-15 15 15-15 15" fill="none" stroke="#9bdfff" stroke-width="4"/>
    <g transform="translate(620 355)">
      <rect width="410" height="280" rx="14" fill="#1747ff"/>
      <text x="32" y="60" fill="#e0edff" font-size="26">CODEX</text>
      <text x="32" y="118" fill="#ffffff" font-size="39" font-weight="700">Learn as you build</text>
      <g fill="#e0edff" font-size="26"><text x="32" y="175">Ask a focused question</text><text x="32" y="216">Review every change</text></g>
    </g>
    <path d="M1052 495h58m-15-15 15 15-15 15" fill="none" stroke="#9bdfff" stroke-width="4"/>
    <g transform="translate(1130 355)">
      <rect width="380" height="280" rx="14" fill="#102a44"/>
      <text x="32" y="60" fill="#9bdfff" font-size="26">GIT + GITHUB</text>
      <text x="32" y="118" fill="#ffffff" font-size="39" font-weight="700">Save the work</text>
      <g fill="#c6d8e8" font-size="26"><text x="32" y="175">Commit a checkpoint</text><text x="32" y="216">Push to your repository</text></g>
    </g>
    <text x="90" y="720" fill="#b7ccdf" font-size="24">LESSON 1 · BEGINNER GUIDE · HTML / CSS / JAVASCRIPT</text>
  </g>
</svg>
