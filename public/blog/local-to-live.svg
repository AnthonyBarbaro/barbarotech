<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">From a local file to a public website</title>
  <desc id="desc">Save writes a file on your computer. Commit records a local checkpoint. Push sends commits to GitHub. Deploy runs that version on Railway. A public URL lets visitors reach it.</desc>
  <rect width="1600" height="600" fill="#071a2d"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="105" fill="#f7fbff" font-size="46" font-weight="700">Saving, committing, and deploying are different steps.</text>
    <g fill="#102a44"><rect x="70" y="195" width="250" height="210" rx="12"/><rect x="372" y="195" width="250" height="210" rx="12"/><rect x="674" y="195" width="250" height="210" rx="12"/><rect x="976" y="195" width="250" height="210" rx="12"/><rect x="1278" y="195" width="250" height="210" rx="12"/></g>
    <g fill="#9bdfff" font-size="31" font-weight="700"><text x="100" y="252">SAVE</text><text x="402" y="252">COMMIT</text><text x="704" y="252">PUSH</text><text x="1006" y="252">DEPLOY</text><text x="1308" y="252">PUBLIC URL</text></g>
    <g fill="#c6d8e8" font-size="25"><text x="100" y="315">File on your</text><text x="100" y="352">computer</text><text x="402" y="315">Checkpoint in</text><text x="402" y="352">local Git history</text><text x="704" y="315">Commits reach</text><text x="704" y="352">GitHub</text><text x="1006" y="315">Code runs on</text><text x="1006" y="352">Railway</text><text x="1308" y="315">Visitors reach</text><text x="1308" y="352">your website</text></g>
    <g fill="none" stroke="#9bdfff" stroke-width="3"><path d="M333 300h25m-10-10 10 10-10 10"/><path d="M635 300h25m-10-10 10 10-10 10"/><path d="M937 300h25m-10-10 10 10-10 10"/><path d="M1239 300h25m-10-10 10 10-10 10"/></g>
    <text x="70" y="510" fill="#b7ccdf" font-size="27">Check each handoff. A local save does not automatically update a public website.</text>
  </g>
</svg>
