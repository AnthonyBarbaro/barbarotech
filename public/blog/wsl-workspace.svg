<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750" role="img" aria-labelledby="title desc">
  <title id="title">Where the editor, terminal, and files run</title>
  <desc id="desc">Windows runs the VS Code interface and browser. Ubuntu inside WSL 2 runs VS Code Server, the Linux terminal, and the project at a Linux home-directory path.</desc>
  <rect width="1600" height="750" fill="#071a2d"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="95" fill="#f7fbff" font-size="45" font-weight="700">One Windows desktop. A Linux development workspace.</text>
    <rect x="70" y="160" width="1460" height="490" rx="16" fill="none" stroke="#42617b" stroke-width="2"/>
    <text x="104" y="212" fill="#b7ccdf" font-size="25">WINDOWS 11</text>
    <rect x="110" y="250" width="530" height="320" rx="12" fill="#102a44"/>
    <text x="144" y="310" fill="#9bdfff" font-size="28" font-weight="700">VS Code interface</text>
    <text x="144" y="360" fill="#c6d8e8" font-size="26">Installed on Windows</text>
    <text x="144" y="435" fill="#9bdfff" font-size="28" font-weight="700">Your web browser</text>
    <text x="144" y="485" fill="#c6d8e8" font-size="26">Preview at localhost:8000</text>
    <path d="M675 398h145m-18-18 18 18-18 18" fill="none" stroke="#9bdfff" stroke-width="4"/>
    <text x="677" y="360" fill="#c6d8e8" font-size="21">WSL connection</text>
    <rect x="855" y="250" width="635" height="320" rx="12" fill="#1747ff"/>
    <text x="890" y="310" fill="#ffffff" font-size="28" font-weight="700">Ubuntu inside WSL 2</text>
    <g fill="#e0edff" font-size="26"><text x="890" y="365">VS Code Server + Linux terminal</text><text x="890" y="415">Git, Python, and your development tools</text><text x="890" y="480">/home/yourname/projects/wsl-demo</text></g>
    <text x="110" y="615" fill="#b7ccdf" font-size="24">Install and manage WSL from PowerShell. Run Linux project commands in Ubuntu.</text>
  </g>
</svg>
